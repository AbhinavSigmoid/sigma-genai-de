version: 2

models:
  - name: mart_merchant_performance
    description: "Aggregated merchant KPIs including total revenue, total transactions, failed count, failure rate, average transaction value, and unique customers."
    columns:
      - name: merchant_id
        description: "Unique identifier for the merchant."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_dim_merchant')
              field: merchant_id
      - name: merchant_name
        description: "Name of the merchant."
        tests:
          - not_null
      - name: category
        description: "Category of the merchant."
      - name: city
        description: "City where the merchant is located."
      - name: total_revenue
        description: "Total revenue generated by the merchant from completed transactions."
        tests:
          - not_null
      - name: total_transactions
        description: "Total number of transactions for the merchant."
        tests:
          - not_null
      - name: failed_count
        description: "Number of failed transactions for the merchant."
        tests:
          - not_null
      - name: failure_rate_pct
        description: "Failure rate percentage for the merchant's transactions."
        tests:
          - not_null
      - name: avg_transaction_value
        description: "Average transaction value for completed transactions."
      - name: unique_customers
        description: "Number of unique customers who made transactions with the merchant."
        tests:
          - not_null
