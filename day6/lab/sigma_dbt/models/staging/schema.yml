version: 2

sources:
  - name: sigma_analytics
    database: SIGMA_DE
    schema: PUBLIC
    tables:
      - name: fact_transactions
      - name: dim_merchant

models:
  - name: stg_transactions
    description: "Staging model for transactions"
    columns:
      - name: transaction_id
        description: "Unique identifier for each transaction"
        tests:
          - not_null
          - unique

      - name: amount
        description: "Amount of the transaction in USD"

      - name: status
        description: "Transaction status"
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'failed', 'pending']

      - name: merchant_id
        description: "Foreign key referencing merchant"
        tests:
          - not_null

      - name: customer_id
        description: "Foreign key referencing customer"
        tests:
          - not_null

      - name: transaction_date
        description: "Date of transaction"

      - name: payment_method
        description: "Payment method"
        tests:
          - accepted_values:
              values: ['credit_card', 'debit_card', 'upi']

  - name: stg_dim_merchant
    description: "Merchant dimension staging model"
    columns:
      - name: merchant_id
        tests:
          - not_null
          - unique

      - name: merchant_name

      - name: category

      - name: city